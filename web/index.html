<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="待办清单">
<title>待办清单 · 云端</title>
<style>
  :root {
    --bg: #f4f5f9; --card: #ffffff; --text: #1c1e26; --muted: #8a8f9e;
    --line: #e4e6ee; --accent: #5b6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161d; --card: #1c1f27; --text: #e8eaf1; --muted: #8a8f9e; --line: #2a2e3a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 18px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; display: flex; align-items: center; justify-content: space-between; }
  h1 .count { font-size: 13px; color: var(--muted); font-weight: 500; }
  .toolbar { display: flex; gap: 8px; margin: 12px 0; }
  .toolbar button {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 13px; padding: 9px; border-radius: 10px; cursor: pointer;
  }
  .toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .list { list-style: none; }
  .item {
    display: flex; align-items: center; gap: 9px; padding: 11px 12px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .item .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .item .cat { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-left: -4px; }
  .item .txt { flex: 1; font-size: 15px; line-height: 1.35; word-break: break-all; }
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .item .due { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .sec { font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
  /* 配置面板 */
  .setup { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .setup h2 { font-size: 16px; margin-bottom: 4px; }
  .setup p { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .setup label { font-size: 13px; display: block; margin: 10px 0 4px; }
  .setup input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 14px; padding: 9px 11px; border-radius: 9px; outline: none;
  }
  .setup button { width: 100%; margin-top: 16px; }
  .msg { text-align: center; font-size: 13px; color: var(--muted); padding: 6px 0; }
  .msg.err { color: #e5484d; }
</style>
</head>
<body>
<div class="wrap">
  <div id="setupView" class="setup" hidden>
    <h2>配置云端同步</h2>
    <p>填入与电脑端「待办清单」设置里一致的三个值（Gitee）。</p>
    <label>Gitee 用户名</label>
    <input id="cfgOwner" placeholder="gitee 用户名">
    <label>仓库名</label>
    <input id="cfgRepo" placeholder="私有仓库名">
    <label>访问令牌（PAT）</label>
    <input id="cfgToken" type="password" placeholder="私人令牌">
    <button id="cfgSave" class="primary">保存并同步</button>
    <div class="msg" id="cfgMsg"></div>
  </div>

  <div id="mainView">
    <h1>待办清单 <span class="count" id="headCount"></span></h1>
    <div class="toolbar">
      <button class="primary" id="refresh">刷新</button>
      <button id="openSettings">设置</button>
    </div>
    <div class="msg" id="status"></div>
    <div class="sec">未完成</div>
    <ul class="list" id="pendingList"></ul>
    <div class="sec" id="doneSec">已完成</div>
    <ul class="list" id="doneList"></ul>
  </div>
</div>

<script>
  var KEY = 'todo.gitee.v1';
  var PRIO_COLORS = ['#8a8f9e', '#4a90d9', '#f5a623', '#e5484d'];

  function loadCfg() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function saveCfg(c) { localStorage.setItem(KEY, JSON.stringify(c)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  function showSetup() { $('setupView').hidden = false; $('mainView').hidden = true; }
  function showMain() { $('setupView').hidden = true; $('mainView').hidden = false; }

  function render(data) {
    var items = data.items || [];
    var cats = data.categories || [];
    var catColor = function (id) { var c = cats.find(function (x) { return x.id === id; }); return c ? c.color : null; };
    var pending = items.filter(function (i) { return !i.done; });
    var done = items.filter(function (i) { return i.done; });
    pending.sort(function (a, b) { return (b.priority || 0) - (a.priority || 0) || (a.createdAt || 0) - (b.createdAt || 0); });
    done.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    $('headCount').textContent = pending.length + '/' + items.length;

    $('pendingList').innerHTML = pending.length ? pending.map(function (it) {
      return row(it, catColor, false);
    }).join('') : '<li class="empty">暂无未完成待办 🎉</li>';

    $('doneSec').style.display = done.length ? '' : 'none';
    $('doneList').innerHTML = done.length ? done.map(function (it) {
      return row(it, catColor, true);
    }).join('') : '';
  }

  function row(it, catColor, done) {
    var pc = PRIO_COLORS[it.priority || 0] || PRIO_COLORS[0];
    var cc = catColor(it.category);
    var due = it.due ? '<span class="due">' + esc(it.due) + '</span>' : '';
    var catDot = cc ? '<span class="cat" style="background:' + cc + '"></span>' : '';
    return '<li class="item' + (done ? ' done' : '') + '">' +
      '<span class="dot" style="background:' + pc + '"></span>' + catDot +
      '<span class="txt">' + esc(it.text) + '</span>' + due + '</li>';
  }

  function setStatus(msg, isErr) {
    $('status').textContent = msg || '';
    $('status').className = 'msg' + (isErr ? ' err' : '');
  }

  function b64decode(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  async function fetchData() {
    var cfg = loadCfg();
    if (!cfg.owner || !cfg.repo || !cfg.token) { showSetup(); return; }
    setStatus('同步中…');
    try {
      var url = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(cfg.owner) +
        '/' + encodeURIComponent(cfg.repo) + '/contents/todo-sync.json?access_token=' + encodeURIComponent(cfg.token);
      var res = await fetch(url);
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      var j = await res.json();
      if (!j || Array.isArray(j) || !j.content) { setStatus('云端暂无数据'); return; }
      var d = JSON.parse(b64decode(j.content));
      if (!d || !Array.isArray(d.items)) { setStatus('云端暂无数据'); return; }
      render(d);
      setStatus('更新于 ' + fmtTime(d.updatedAt));
    } catch (e) {
      setStatus('同步失败：' + (e && e.message ? e.message : e), true);
    }
  }

  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  $('cfgSave').addEventListener('click', function () {
    var c = {
      owner: $('cfgOwner').value.trim(),
      repo: $('cfgRepo').value.trim(),
      token: $('cfgToken').value.trim(),
    };
    if (!c.owner || !c.repo || !c.token) { $('cfgMsg').textContent = '请填完三项'; return; }
    saveCfg(c);
    showMain();
    fetchData();
  });
  $('refresh').addEventListener('click', fetchData);
  $('openSettings').addEventListener('click', function () {
    var c = loadCfg();
    $('cfgOwner').value = c.owner || '';
    $('cfgRepo').value = c.repo || '';
    $('cfgToken').value = c.token || '';
    $('cfgMsg').textContent = '';
    showSetup();
  });

  // 初始化
  var cfg = loadCfg();
  if (!cfg.owner || !cfg.repo || !cfg.token) showSetup();
  else { showMain(); fetchData(); }
</script>
</body>
</html>
